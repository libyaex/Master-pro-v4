# تشغيل على Railway
[tool.poetry]
name = "master-pro-v4"
version = "4.0.0"
description = "Zero-cost multi-exchange trading intelligence (Arabic-first)"
authors = ["libyaex"]
package-mode = false

[tool.poetry.dependencies]
python = "3.12.*"
fastapi = ">=0.115"
uvicorn = {extras = ["standard"], version = ">=0.32"}
pydantic = ">=2.9"
httpx = ">=0.27"
websockets = ">=13.1"
python-dotenv = ">=1.0"
cryptography = ">=43.0"
numpy = ">=2.1"
pandas = ">=2.2"
scipy = ">=1.14"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-asyncio = ">=0.24"
